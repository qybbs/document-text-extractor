services:
  document-extractor:
    build:
      context: .
      args:
        INSTALL_EASYOCR: "${INSTALL_EASYOCR:-false}"
        USE_GPU: "${USE_GPU:-false}"
    image: document-extractor:latest
    container_name: document-extractor
    ports:
      - "8000:8000"
    environment:
      TESSERACT_CMD: "/usr/bin/tesseract"
      MAX_FILE_SIZE_MB: "50"
    volumes:
      - ./app:/app/app
      - ./static:/app/static
    restart: unless-stopped
